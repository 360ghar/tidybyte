<!-- Sticky header: logo left, nav centre (md+), CTA + theme toggle + menu right.
     Theme toggle + popover markup is byte-identical to the previous index.html
     (data-theme-toggle / data-theme-menu / data-theme-option / data-theme-dot),
     with focus classes normalised to focus-visible + clay-pink ring (a11y fix). -->
<header class="sticky top-0 z-40 border-b border-hairline bg-canvas/85 backdrop-blur">
  <div class="container-prose flex h-16 items-center justify-between gap-2 sm:gap-4">
    <a href="/" class="font-display text-lg font-semibold tracking-tight text-ink">TidyByte<span aria-hidden="true" class="text-clay-pink">.</span></a>

    <nav aria-label="Primary" class="hidden items-center gap-1 md:flex">
      <a href="#features" class="nav-link">Features</a>
      <a href="#how-it-works" class="nav-link">How it works</a>
      <a href="/blog" class="nav-link">Blog</a>
      <a href="#faq" class="nav-link">FAQ</a>
      <a href="/changelog" class="nav-link">Changelog</a>
      <a href="/support" class="nav-link">Support</a>
      <a href="https://github.com/360ghar/snap-clean-ios" target="_blank" rel="noopener" class="nav-link" aria-label="TidyByte on GitHub">

      </a>
    </nav>

    <div class="flex items-center gap-1 sm:gap-1.5">
      <!-- Theme toggle: Light / Dark / System -->
      <div class="relative">
        <button type="button" data-theme-toggle aria-haspopup="menu" aria-expanded="false" aria-label="Change color theme" class="icon-btn inline-flex h-9 w-9 items-center justify-center rounded-full text-body transition hover:bg-surface-card hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay-pink/50">
          <svg data-theme-icon="sun" aria-hidden="true" focusable="false" class="block dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg data-theme-icon="moon" aria-hidden="true" focusable="false" class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <div data-theme-menu role="menu" aria-label="Color theme" class="hidden absolute right-0 top-11 z-50 w-36 rounded-xl border border-hairline bg-surface-card p-1 shadow-pop">
          <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="light" class="flex w-full items-center gap-2 rounded-lg px-3 py-1.5 text-left text-sm text-body transition hover:bg-canvas focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay-pink/50">
            <svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            Light
            <span data-theme-dot aria-hidden="true" class="ml-auto h-1.5 w-1.5 rounded-full bg-clay-pink opacity-0"></span>
          </button>
          <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="dark" class="flex w-full items-center gap-2 rounded-lg px-3 py-1.5 text-left text-sm text-body transition hover:bg-canvas focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay-pink/50">
            <svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
            Dark
            <span data-theme-dot aria-hidden="true" class="ml-auto h-1.5 w-1.5 rounded-full bg-clay-pink opacity-0"></span>
          </button>
          <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="system" class="flex w-full items-center gap-2 rounded-lg px-3 py-1.5 text-left text-sm text-body transition hover:bg-canvas focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay-pink/50">
            <svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            System
            <span data-theme-dot aria-hidden="true" class="ml-auto h-1.5 w-1.5 rounded-full bg-clay-pink opacity-0"></span>
          </button>
        </div>
      </div>

      <!-- CTA: visible on every viewport; compact sizing on small screens.
           Plain utilities override the btn-primary component layer. -->
      <a href="https://apps.apple.com/in/app/tidybyte/id6775769763" target="_blank" rel="noopener" class="btn-primary gap-1.5 px-3 py-2 text-xs sm:gap-2 sm:px-5 sm:py-2.5 sm:text-sm">
        <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.46 2.23-1.21 3.05-.81.87-2.14 1.55-3.23 1.46-.14-1.1.4-2.25 1.16-3.04.85-.89 2.29-1.55 3.28-1.47Zm3.61 16.04c-.6 1.39-1.31 2.62-2.18 3.66-1.13 1.39-2.46 3.05-4.25 3.07-1.7.02-2.14-.99-4.46-.99-2.32 0-2.8 1.01-4.5.99-1.79-.02-3.15-1.6-4.28-2.99-2.6-3.2-4.59-9.05-1.92-12.99 1.32-1.95 3.69-3.18 6.25-3.22 1.78-.04 3.46 1.05 4.55 1.05 1.08 0 3.13-1.3 5.28-1.11.9.04 3.43.36 5.05 2.71-.13.08-3.02 1.76-2.99 5.25.04 4.17 3.66 5.55 3.45 5.57Z"/></svg>
        Get the app
      </a>

      <button type="button" data-menu-toggle aria-controls="mobile-menu" aria-expanded="false" aria-label="Toggle menu" class="icon-btn inline-flex h-9 w-9 items-center justify-center rounded-full text-ink transition hover:bg-surface-card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay-pink/50 md:hidden">
        <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
  </div>

  <div id="mobile-menu" data-mobile-menu class="hidden border-t border-hairline md:hidden">
    <!-- data-drawer is the collapsing grid: the disclosure animates its own
         height so the page below never jumps. See input.css motion system. -->
    <div data-drawer>
      <nav aria-label="Mobile" class="container-prose flex flex-col gap-1 py-3 text-sm">
        <a href="#features" class="nav-link">Features</a>
        <a href="#how-it-works" class="nav-link">How it works</a>
        <a href="/blog" class="nav-link">Blog</a>
        <a href="#faq" class="nav-link">FAQ</a>
        <a href="/changelog" class="nav-link">Changelog</a>
        <a href="/support" class="nav-link">Support</a>
        <a href="https://github.com/360ghar/snap-clean-ios" target="_blank" rel="noopener" class="nav-link">GitHub &rarr;</a>
      </nav>
    </div>
  </div>
</header>

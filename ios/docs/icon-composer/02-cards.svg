<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tb-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E54DE"/>
      <stop offset="100%" stop-color="#9881FF"/>
    </linearGradient>
    <linearGradient id="tb-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E6BF0"/>
      <stop offset="100%" stop-color="#7B93FF"/>
    </linearGradient>
    <linearGradient id="tb-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B6FD8"/>
      <stop offset="50%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#2F9BFF"/>
    </linearGradient>
    <linearGradient id="tb-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14"/>

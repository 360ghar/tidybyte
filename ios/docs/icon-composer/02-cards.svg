  <g transform="translate(512,512) scale(1024,-1024) translate(-0.5,-0.5)">
    <rect x="0.3" y="0.3" width="0.55" height="0.55" rx="0.11" fill="url(#tb-back)"/>
    <rect x="0.225" y="0.225" width="0.55" height="0.55" rx="0.11" fill="url(#tb-mid)"/>
    <rect x="0.15" y="0.15" width="0.55" height="0.55" rx="0.11" fill="url(#tb-front)"/>
    <g clip-path="url(#tb-front-clip)">
      <rect x="0.15" y="0.513" width="0.55" height="0.187" fill="url(#tb-highlight)"/>
    </g>

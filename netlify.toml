# Netlify configuration for the TidyByte marketing site (Astro build).
# Build: astro build renders dist/ from src/; Tailwind CLI compiles
# src/input.css → dist/assets/css/styles.css; hash-assets.mjs fingerprints
# CSS/JS and rewrites references. Publish: dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12 (build-time only; the site is static).
  NODE_VERSION = "22"

# llms.txt content-type for AI crawlers.
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Per-post Markdown alternates for AI citation fetchers.
[[headers]]
  for = "/blog/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Markdown alternates for the tool landing pages (/storage-cleaner.md, ...).
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Cache and security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'"

# Long cache for fingerprinted/static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Short cache for crawler files (regenerated every deploy).
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Custom 404.
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# Pretty URLs — serve /support from /support.html etc.
[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/changelog"
  to = "/changelog.html"
  status = 200

# Tool landing pages — one page per cleanup job, served from <slug>.html.
# Trailing slashes are 301'd away first so /<slug>/ never resolves to
# /<slug>/.html (same ordering rule as the blog routes below).
[[redirects]]
  from = "/:slug/"
  to = "/:slug"
  status = 301


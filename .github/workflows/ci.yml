name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older run, which no one will
# read. Runs on main are never cancelled, so every commit there gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The iOS app lives in ios/. Both jobs here are required checks on main, so
  # they run on every pull request, including Mac-only ones; the Mac app has its
  # own workflow, macos.yml.
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The runner image changes which simulators it ships, and a hard-coded
      # device name ("iPhone 16") failed every build the day the image dropped
      # it. This picks the first iPhone on the newest iOS runtime instead, and
      # exports it as DESTINATION for the build, catalog and test steps. iPhone
      # Duo is skipped: it is the first iPhone on the iOS 27.1 runtime, and the
      # suite is not written for its two displays.
      #
      # The simulator also starts booting here, in the background. A cold boot
      # on the runner took 8 minutes, and `xcodebuild test` only started it after
      # the build; now it boots while the build and catalog steps run.
      - name: Pick and boot an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rts = sorted((k for k in d if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          print(next(x["udid"] for k in reversed(rts) for x in d[k] if x["name"].startswith("iPhone") and "Duo" not in x["name"]))')
          echo "Using simulator $id"
          echo "DESTINATION=platform=iOS Simulator,id=$id" >> "$GITHUB_ENV"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$id" > /dev/null 2>&1 &

      # Builds the app and both test bundles once. The Test step reuses them
      # with `test-without-building`, and a compile error in a test now fails
      # here, before the slow steps.
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project Tidybyte.xcodeproj \
            -scheme Tidybyte \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # Regenerates both String Catalogs from source, then fails if that
      # produced a change. A stale catalog is otherwise invisible: the app
      # builds and runs, it just shows English where a translation exists, and
      # nobody notices until a user reports it.
      #
      # There are two catalogs, and they are not interchangeable.
      # `Localizable.xcstrings` serves everything the app draws.
      # `AppShortcuts.xcstrings` serves the Siri phrases, which App Intents
      # looks up in a table named `AppShortcuts`. A phrase put in the app
      # catalog instead is never read, and the app catalog still reports 100%
      # coverage — that mistake shipped once, so both files are diffed here.
      #
      # `refresh.sh` also runs `check.mjs`, which enforces language coverage,
      # placeholder parity, CLDR plural categories, the App Shortcuts app-name
      # token, and that every `INFOPLIST_KEY_*UsageDescription` in project.yml
      # has a catalog entry.
      #
      # `DESTINATION` comes from the "Pick and boot an iPhone simulator" step, so this
      # uses the same simulator as the build and test steps. Left to its default
      # the script picks a fixed device name, and a runner that lacks it fails
      # here instead of at build.
      - name: Verify localization catalogs are current
        run: |
          ./scripts/localization/refresh.sh
          git diff --exit-code -- \
            Tidybyte/Resources/Localizable.xcstrings \
            Tidybyte/Resources/AppShortcuts.xcstrings \
            Tidybyte/InfoPlist.xcstrings

      # Catches the class of bug the catalog sync cannot see: user-facing text
      # that never reaches the catalog at all. A SwiftUI `Text` literal is
      # extracted by the compiler, but the same sentence passed as a `String`
      # parameter or built in a view model is not, so it renders raw English in
      # every language while every coverage number still reads 100%.
      #
      # Four scans, each for a shape that hides a string completely:
      #   - `L10n.string(rawValue)` — a key computed from an enum, invisible to
      #     any literal scan. Seven enums had this shape; 16 keys were missing.
      #   - a literal nested in an interpolation, e.g.
      #     `Text("Couldn't \(ok ? "load" : "download") …")` — `Text` renders
      #     the inner `String` verbatim, so every language kept the English
      #     fragment. The German template read "load dieses video …".
      #   - prose in a `String` parameter that no call site localizes.
      #   - Siri phrases missing from `AppShortcuts.xcstrings`, or that lost
      #     their `${applicationName}` token, which stops Siri matching the
      #     shortcut at all.
      - name: Check for unlocalized user-facing strings
        run: node scripts/localization/extract.mjs --check

      # `refresh.sh` above runs `check.mjs` without `--strict`, so a key that
      # still carries the English text passes there and is merely reported.
      # That is right locally — you add a string, run refresh, and see what is
      # left to translate. In CI it must fail, or an untranslated string ships
      # in 20 languages with a green build.
      - name: Verify every key is translated in every language
        run: node scripts/localization/check.mjs --strict

      # The App Store listing is translated by hand into 20 languages, and the
      # limits are hard: App Store Connect truncates a subtitle past 30
      # characters and rejects a description past 4000. A field that overflows
      # is discovered at upload time, which is the worst moment to find it.
      - name: Validate App Store listings
        run: node scripts/localization/check-listings.mjs --strict

      - name: Test
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test-without-building \
            -project Tidybyte.xcodeproj \
            -scheme Tidybyte \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # The App Store growth creatives render in their own workflow,
      # growth.yml, which runs only when their inputs change. Here they added
      # about 6 minutes to every run.

  # The marketing site lives in website/.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # The localized landing pages are generated from the English page, so a
      # translation edit that nobody rebuilt is a page still showing English
      # under a `lang` attribute that claims otherwise. Regenerating and
      # diffing catches it the same way the iOS catalog gate does.
      #
      # The builder also fails outright when an English string has no
      # translation, which is the stronger check of the two.
      - name: Verify localized landing pages are current
        run: |
          node scripts/localization/site/extract-site-strings.mjs
          node scripts/localization/site/build-site-translations.mjs
          git diff --exit-code -- \
            src/content/pages/ \
            scripts/localization/site/site-strings.json \
            scripts/localization/site/site-meta.json

      # Builds all 87 pages, then audits them: title and description budgets,
      # duplicate titles, hreflang parity, per-page `lang` and `dir`, sitemap
      # coverage, and a Markdown alternate for every sitemap URL. The localized
      # pages are the ones most likely to break it — a missing `dir="rtl"` or a
      # title over budget fails here rather than in search results.
      - name: Build and audit the site
        run: |
          npm run build
          npm run check

      # iPhone Duo (foldable, iOS 27.1) presents the system bars vertically on a
      # side edge and can resize the window at any moment, so code that reads the
      # device — screen size, idiom, orientation — instead of the window looks
      # fine in one pose and breaks in the next. The compiler says nothing about
      # that, so this static scan fails the build on the banned patterns. It reads
      # Swift sources only and has no macOS dependencies, so it runs here, on the
      # cheaper Linux runner. It needs no npm packages.
      - name: Guard against non-resizable layout patterns
        working-directory: ios
        run: npm run check:duo

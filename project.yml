name: Tidybyte
options:
  bundleIdPrefix: com.tidybyte
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Single version source (A10): every target inherits these; bump once here.
    # 1.1.1 / build 8: the release that finally ships the iPhone Duo work and
    # the review fixes. Live 1.1.0 is build 7, uploaded before either landed, so
    # users have the 20-language release and nothing else (see the version table
    # in docs/APP_STORE_LISTING.md). A released version cannot be reopened, so
    # the new work needs a new version string; build 8 was never uploaded and is
    # still free.
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: "1.1.1"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TidyByte needs access to your photo library to help you organize and clean up photos and videos."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "TidyByte needs write access to save compressed videos and converted photos."
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HMWGCVU4SV
    CODE_SIGN_IDENTITY: "Apple Development"
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
    # Xcode "Update to Recommended Settings" — this project is XcodeGen-managed, so
    # these live here rather than in .pbxproj (which is wiped on regen).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Emit .stringsdata during the build so `xcstringstool sync` can populate
    # Localizable.xcstrings from the compiler's own view of every localizable
    # literal — including correct placeholder types and plural variations,
    # which a regex-based extractor cannot get right.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Tidybyte:
    type: application
    platform: iOS
    sources:
      - path: Tidybyte
        excludes:
          - "Scripts/**"
          - "*.entitlements"
          - "Info.plist"
    resources:
      - path: Tidybyte/Resources
        buildPhase: resources
      # `Tidybyte/InfoPlist.xcstrings` is picked up automatically by the
      # `sources` path above — Xcode compiles any .xcstrings it finds into
      # `InfoPlist.strings`, which is how the permission prompts get localized.
      # Listing it again here makes the build fail with "Cannot have multiple
      # InfoPlist.xcstrings files in same target", so it is deliberately absent.
    dependencies:
      - target: TidybyteWidget
        embed: true
    entitlements:
      path: Tidybyte/Tidybyte.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sakshammittal.tidybyte.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakshammittal.tidybyte
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: TidyByte
        GENERATE_INFOPLIST_FILE: YES
        # Seed Info.plist supplies a valid top-level UILaunchScreen dict; Xcode overlays
        # the generated INFOPLIST_KEY_* values on top. A valid launch screen is required
        # for the app to use the full screen on iPad (otherwise iOS letterboxes it).
        # The INFOPLIST_KEY_UILaunchScreen_Generation build setting emits an invalid
        # nested UILaunchScreen, so we provide the dict via this seed instead.
        INFOPLIST_FILE: Tidybyte/Info.plist
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone stays portrait-only (the swipe UX is portrait-centric); iPad supports all orientations.
        # Xcode maps the _iPad-suffixed INFOPLIST_KEY to the UISupportedInterfaceOrientations~ipad plist key.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  TidybyteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TidybyteWidget
        excludes:
          - "*.entitlements"
          - "Info.plist"
      - path: Tidybyte/Shared/Widget
      # The widget renders its own text in its own process, so it needs the
      # language model to resolve the user's choice and the storage accessor to
      # read it from the App Group. Foundation-only, so no SwiftUI/WidgetKit
      # coupling leaks into the app target from these two.
      - path: Tidybyte/Shared/Localization/AppLanguage.swift
      - path: Tidybyte/Shared/Localization/LanguagePreferenceStore.swift
      # `L10n` resolves a key against the chosen language's `.lproj` bundle, and
      # `Formatters` formats sizes and relative dates in that locale. The widget
      # builds its headline, age, and row labels in code rather than as `Text`
      # literals, so it needs both. Both depend only on the two files above.
      - path: Tidybyte/Shared/Localization/L10n.swift
      - path: Tidybyte/Shared/Localization/Formatters.swift
    resources:
      # The widget shares the app's catalog rather than keeping its own.
      #
      # One catalog means one translation file per language, one coverage gate,
      # and no chance of the widget drifting from the app's terminology. The
      # widget's own strings are a dozen keys, so the extra table costs a few
      # hundred bytes in the extension bundle.
      - path: Tidybyte/Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: TidybyteWidget/Info.plist
      properties:
        CFBundleDisplayName: TidyByte
        # Version comes from the shared base MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # (single version source, A10).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TidybyteWidget/TidybyteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sakshammittal.tidybyte.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakshammittal.tidybyte.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete

  TidybyteTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: Tidybyte
    sources:
      - path: TidybyteTests
    dependencies:
      - target: Tidybyte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakshammittal.tidybyte.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"

  # Layout integrity at large text sizes. This is the only way to actually
  # verify the Dynamic Type work: static analysis can show that @ScaledMetric is
  # applied, but only a running app shows whether the scaled controls still fit
  # on screen and stay reachable.
  TidybyteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TidybyteUITests
    dependencies:
      - target: Tidybyte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakshammittal.tidybyte.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"

# Declared explicitly so both test bundles run from the Tidybyte scheme. Without
# this, XcodeGen's generated scheme only picks up the unit-test target.
schemes:
  Tidybyte:
    build:
      targets:
        Tidybyte: all
    run:
      config: Debug
      executable: Tidybyte
    test:
      config: Debug
      targets:
        - TidybyteTests
        - TidybyteUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

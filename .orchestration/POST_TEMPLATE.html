<!-- ============================================================
POST_TEMPLATE.html — the ONLY template for blog posts (D1–D3).

Fill every {{PLACEHOLDER}}. Keep the post's existing <head> except:
  og:image + twitter:image → https://tidybyte.360ghar.com/assets/img/blog/{{SLUG}}-og.jpg
  og:image:width → 1200  og:image:height → 630
Keep the existing sticky <header>, skip-link, and <footer> untouched.
Keep all existing body prose unless a DECISIONS.md claim rewrite applies.

Byline numbers come from .orchestration/post-map.json (read_min, date).
TOC entries must match the h2 ids you assign below, same order.
============================================================ -->

<!-- ARTICLE HEADER — replaces the current breadcrumb..lede block -->
<nav aria-label="Breadcrumb" class="container-prose mx-auto max-w-prose pt-6 text-sm">
  <ol class="flex items-center gap-1.5 text-muted">
    <li><a href="/" class="text-muted hover:text-ink hover:underline">Home</a></li>
    <li aria-hidden="true">/</li>
    <li><a href="/blog" class="text-muted hover:text-ink hover:underline">Blog</a></li>
  </ol>
</nav>

<article class="container-prose mx-auto max-w-prose px-4 pb-16 pt-8 sm:pt-10">
  <div class="flex flex-wrap items-center gap-2">
    <a href="/blog#cat-{{CAT}}" class="badge">{{CatLabel}}</a>
  </div>

  <h1 class="h-display mt-4">{{H1}}</h1>

  <p class="lede mt-5">{{LEDE}}</p>

  <div class="mt-6 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-muted">
    <time datetime="{{DATE_ISO}}">{{DATE_LONG}}</time>
    <span aria-hidden="true">&middot;</span>
    <span>{{READ_MIN}} min read</span>
  </div>

  <figure class="mt-8">
    <picture>
      <source srcset="/assets/img/blog/{{SLUG}}.avif" type="image/avif">
      <img src="/assets/img/blog/{{SLUG}}.webp" alt="{{ALT}}" width="1400" height="933"
           loading="eager" fetchpriority="high" decoding="async"
           class="block h-auto w-full rounded-2xl border border-hairline">
    </picture>
  </figure>

  <!-- ON THIS PAGE — every entry targets an h2 id below -->
  <nav aria-labelledby="toc-h" class="clay-card mt-10 p-5 sm:p-6">
    <h2 id="toc-h" class="font-display text-sm font-semibold uppercase tracking-[0.12em] text-muted">On this page</h2>
    <ol class="mt-3 space-y-2 text-[15px]">
      <li><a href="#{{SLUG-section-1}}" class="link decoration-1">{{Section 1}}</a></li>
      <li><a href="#{{SLUG-section-2}}" class="link decoration-1">{{Section 2}}</a></li>
      <!-- one li per h2, same order as the body -->
    </ol>
  </nav>

  <!-- BODY — keep existing h2/h3/p/table/ul content. Rules:
       - every h2:  <h2 id="{{section-id}}" class="h-section mt-12 scroll-mt-24 text-2xl sm:text-3xl">
       - every h3:  <h3 class="mt-8 text-lg font-semibold text-ink">
       - tables:    wrap in <div class="clay-card mt-6 overflow-x-auto p-1"> <table class="w-full min-w-[36rem] text-left text-sm"> thead: text-ink, th py-3 px-3 font-semibold; td: border-t border-hairline px-3 py-2.5 align-top
       - yes/no cells: <span class="font-medium text-success">Yes</span> / text-destructive — never hexes
       - FAQ block uses:
  -->
  <section class="mt-12">
    <h2 id="faq" class="h-section scroll-mt-24 text-2xl sm:text-3xl">FAQ</h2>
    <div class="mt-6 space-y-3">
      <details class="clay-card group p-5 sm:p-6">
        <summary class="faq-summary">{{Question}}
          <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="faq-chev"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <p class="muted mt-4 leading-relaxed">{{Answer}}</p>
      </details>
    </div>
  </section>

  <!-- RELATED POSTS — 3 cards, data from post-map.json "related" -->
  <section aria-labelledby="related-h" class="mt-14">
    <h2 id="related-h" class="h-section text-2xl sm:text-3xl">Keep reading</h2>
    <div class="mt-6 grid gap-4 sm:grid-cols-3">
      <a href="/blog/{{REL_SLUG}}" class="clay-card group overflow-hidden transition hover:-translate-y-0.5 hover:shadow-pop">
        <img src="/assets/img/blog/{{REL_SLUG}}-card.webp" alt="{{REL_ALT}}" width="640" height="427"
             loading="lazy" decoding="async" class="block aspect-[3/2] h-auto w-full object-cover">
        <div class="p-4">
          <h3 class="font-display text-base font-medium leading-snug text-ink group-hover:underline">{{REL_TITLE}}</h3>
          <p class="muted mt-2 text-xs">{{REL_DATE_LONG}} &middot; {{REL_READ_MIN}} min read</p>
        </div>
      </a>
      <!-- ×3 -->
    </div>
  </section>
</article>
